<!DOCTYPE html>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configuração de Cores (Paleta Tech/Blue) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkblue: '#0B1120',
                        cyan: '#06B6D4',

            transform: translateY(-2px);
        }
        .btn-link {
            transition: all 0.3s ease;
